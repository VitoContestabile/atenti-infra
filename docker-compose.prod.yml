services:
  database:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  backend:
    image: ghcr.io/facultaddeingenieria/atenti-backend:latest
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
    expose:
      - "8080"
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    image: ghcr.io/facultaddeingenieria/atenti-frontend:latest
    restart: always
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://atenzia.duckdns.org/backend
    expose:
      - "3000"


  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    # Recarga cada 6h para tomar el certificado que renueva certbot-renew.
    # nginx lee los certs una sola vez al arrancar: sin este reload seguiría
    # sirviendo el viejo hasta el próximo restart.
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  # Invocación puntual: emitir el certificado inicial (init-letsencrypt.sh) o
  # forzar una renovación (renew-cert.sh). No corre solo.
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  # Renovación desatendida. Intenta cada 12h; certbot no hace nada hasta que
  # falten 30 días para el vencimiento, así que es barato repetirlo.
  # Está separado de 'certbot' a propósito: si el loop fuera el entrypoint de
  # ese servicio, los `docker compose run --rm certbot certonly ...` de los
  # scripts caerían adentro del loop en vez de emitir el certificado.
  certbot-renew:
    image: certbot/certbot
    restart: always
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot; sleep 12h & wait $${!}; done"

volumes:
  database-data:
  minio-data: